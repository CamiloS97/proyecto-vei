<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#128321">
    <title>Iniciar sesión | EduMatch</title>
    <link rel="stylesheet" href="./estilos/estilo-header.css">
    <link rel="stylesheet" href="./estilos/estilo-login.css">
</head>
<body>
    <header>
        <nav class="barra-de-navegacion">
            <a href="./index.html" aria-label="EduMatch, inicio">
                <img src="./imagenes/logotipo2.svg" alt="Logotipo de EduMatch">
            </a>
            <button class="boton-menu" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="opciones-navegacion">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul id="opciones-navegacion">
                
                <li><a href="./index.html" aria-current="page">Volver</a></li>
            </ul>
        </nav>
    </header>
    <script src="./menu.js" defer></script>
    <main>
        <section class="formulario-inicio-sesion" aria-labelledby="titulo-inicio-sesion">
            <h1 id="titulo-inicio-sesion">Iniciar sesión</h1>
            <form action="#" method="post">
                <div class="campo-inicio-sesion">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" autocomplete="email" required>
                </div>
                <div class="campo-inicio-sesion">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
                </div>
                <p>¿olvidaste la contraseña?</p>
                <button type="submit">Iniciar sesión</button>
                <p>¿No estas registrado? <a href="./opciones-de-registro.html">Registrate</a></p>
            </form>
        </section>
    </main>
</body>
</html>
